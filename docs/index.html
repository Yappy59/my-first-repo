<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ぐんぐん">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5F8FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111925" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ぐんぐんノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one-screen notebook app — grid-paper ground, one task per screen, big pressable buttons. */
:root{
  --paper:#F5F8FB; --grid:#E2EAF2; --card:#FFFFFF; --ink:#22314A; --ink2:#5A6A80;
  --line:#D3DDE8; --press:#C6D3E1; --guide:#F0B4AE;
  --kata:#D6453A; --kataBg:#FDEBE8;
  --math:#2570CC; --mathBg:#E7F0FB;
  --life:#21905C; --lifeBg:#E3F4EA;
  --star:#EFAE00; --oops:#D9741A; --oopsBg:#FDF0E2;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-kana:"Klee One","Hiragino Mincho ProN","YuKyokasho","Yu Mincho",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111925; --grid:#1A2533; --card:#1B2636; --ink:#E9EFF7; --ink2:#9DAEC4;
  --line:#2D3B50; --press:#0B111A; --guide:#6E3C3C;
  --kata:#FF7468; --kataBg:#3A2024; --math:#62A6FF; --mathBg:#172B45;
  --life:#4CCB8F; --lifeBg:#143226; --star:#FFCC33; --oops:#FFA050; --oopsBg:#3A2A19;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111925; --grid:#1A2533; --card:#1B2636; --ink:#E9EFF7; --ink2:#9DAEC4;
  --line:#2D3B50; --press:#0B111A; --guide:#6E3C3C;
  --kata:#FF7468; --kataBg:#3A2024; --math:#62A6FF; --mathBg:#172B45;
  --life:#4CCB8F; --lifeBg:#143226; --star:#FFCC33; --oops:#FFA050; --oopsBg:#3A2A19;
  color-scheme:dark}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  word-break:keep-all;overflow-wrap:anywhere;line-break:strict}
.panel,.dialog p{word-break:normal}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--math);outline-offset:3px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.35}
p{margin:0}

#app{min-height:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 20px}
.screen{flex:1;display:flex;flex-direction:column;gap:16px;animation:fadein .25s ease}
@keyframes fadein{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- common bits ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.brand{font-weight:900;font-size:clamp(22px,5vw,30px);letter-spacing:.04em}
.brand small{display:block;font-size:13px;font-weight:500;color:var(--ink2);letter-spacing:.02em}
.pill{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;font-variant-numeric:tabular-nums}
.pill .s{color:var(--star)}
.iconbtn{width:52px;height:52px;flex:none;border-radius:16px;border:2px solid var(--line);background:var(--card);font-size:22px;display:grid;place-items:center;box-shadow:0 3px 0 var(--press)}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--press)}
.backrow{display:flex;align-items:center;gap:12px;min-height:56px}
.backrow h1{font-size:clamp(22px,5vw,30px);font-weight:900}
.lead{color:var(--ink2);font-size:17px}

.bigbtn{min-height:64px;border-radius:18px;border:3px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:700;font-size:20px;padding:10px 20px;box-shadow:0 5px 0 var(--press)}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--press)}
.bigbtn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.bigbtn.move{background:var(--star);border-color:var(--star);color:#2A2100}
.softbtn{min-height:48px;border-radius:14px;border:2px dashed var(--ink2);background:transparent;color:var(--ink2);font-weight:700;padding:6px 16px}
.rbtns{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}

/* ---------- home ---------- */
.hello{font-size:clamp(20px,4.5vw,26px);font-weight:700}
.tiles{display:grid;gap:14px}
.tile{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:16px;text-align:left;padding:16px;border-radius:24px;border:3px solid var(--c);background:var(--cb);box-shadow:0 6px 0 var(--c);min-height:120px}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--c)}
.tile .glyph{width:84px;height:84px;border-radius:12px;background:var(--card);border:3px solid var(--c);display:grid;place-items:center;font-size:52px;font-family:var(--f-kana);color:var(--c);position:relative}
.tile .glyph.num{font-family:var(--f-body);font-weight:900;font-size:30px}
.tile .tname{display:block;font-size:clamp(22px,5vw,28px);font-weight:900;color:var(--ink)}
.tile .tsub{display:block;font-size:15px;color:var(--ink2);font-weight:500}
.t-kata,.tile.kata{--c:var(--kata);--cb:var(--kataBg)}
.t-math,.tile.math{--c:var(--math);--cb:var(--mathBg)}
.t-life,.tile.life{--c:var(--life);--cb:var(--lifeBg)}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini{min-height:72px;border-radius:18px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:15px;line-height:1.3;padding:8px;box-shadow:0 4px 0 var(--press);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.mini b{font-size:24px;line-height:1}
.mini:active{transform:translateY(3px);box-shadow:0 1px 0 var(--press)}
@media (min-width:720px){
  .tiles{grid-template-columns:repeat(3,1fr)}
  .tile{grid-template-columns:1fr;justify-items:center;align-content:start;text-align:center;padding:28px 14px 20px;min-height:260px}
  .tile .glyph{width:112px;height:112px;font-size:72px}
  .tile .glyph.num{font-size:40px}
}

/* ---------- level menus ---------- */
.levels{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.lv{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;text-align:left;padding:14px;border-radius:20px;border:2px solid var(--line);background:var(--card);box-shadow:0 4px 0 var(--press);min-height:84px}
.lv:active{transform:translateY(3px);box-shadow:0 1px 0 var(--press)}
.lv .lvg{width:56px;height:56px;border-radius:10px;border:2.5px solid var(--c);color:var(--c);background:var(--cb);display:grid;place-items:center;font-family:var(--f-kana);font-size:26px;line-height:1;text-align:center}
.lv .lvg.num{font-family:var(--f-body);font-weight:900;font-size:19px}
.lv .lvn{display:block;font-weight:700;font-size:19px;line-height:1.3}
.lv .lvs{display:block;font-size:14px;color:var(--ink2);line-height:1.4}
.lv .lvb{font-size:13px;color:var(--ink2);text-align:right;line-height:1.3;font-variant-numeric:tabular-nums}
.lv .lvb .s{color:var(--star);font-size:18px}
.grade{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px;background:var(--cb);color:var(--c);border:1.5px solid var(--c)}
.sechead{font-size:15px;font-weight:700;color:var(--ink2);letter-spacing:.06em;margin-top:4px}

/* ---------- quiz ---------- */
.qbar{display:flex;align-items:center;gap:10px;min-height:56px}
.dots{flex:1;display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.dot{width:16px;height:16px;border-radius:50%;background:var(--line);transition:transform .2s}
.dot.ok{background:var(--star)}
.dot.miss{background:var(--ink2);opacity:.45}
.dot.now{transform:scale(1.35);box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--c)}
.qtitle{flex:1;text-align:center;font-weight:700;color:var(--c)}
.prompt{text-align:center;font-weight:700;font-size:clamp(20px,4.6vw,28px)}
.stage{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:180px}
.maru{position:absolute;inset:0;margin:auto;width:min(80%,320px);height:auto;aspect-ratio:1;pointer-events:none;opacity:0}
.maru circle{fill:none;stroke:var(--kata);stroke-width:9;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.maru.show{opacity:.9}
.maru.show circle{animation:draw .45s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}

.masus{display:flex;gap:0}
.masu{position:relative;width:clamp(160px,42vmin,250px);aspect-ratio:1;max-width:100%;background:var(--card);border:3px solid var(--c);display:grid;place-items:center;
  font-family:var(--f-kana);font-weight:600;font-size:clamp(118px,31vmin,185px);line-height:1;color:var(--ink)}
.masus .masu+.masu{border-left-width:0}
.masus.two .masu{width:clamp(130px,34vmin,210px);font-size:clamp(96px,25vmin,155px)}
.masu::before,.masu::after{content:"";position:absolute;pointer-events:none}
.masu::before{left:50%;top:0;bottom:0;border-left:2px dashed var(--guide)}
.masu::after{top:50%;left:0;right:0;border-top:2px dashed var(--guide)}
.masu span{position:relative;z-index:1}
.masu.small span{font-size:.62em;align-self:end;justify-self:start;margin:0 0 12% 14%}
.masu.hh{border-color:var(--ink2);color:var(--ink2)}
.masulabel{font-size:14px;font-weight:700;color:var(--ink2);letter-spacing:.1em}
.wordcard{font-family:var(--f-kana);font-weight:600;font-size:clamp(52px,12vmin,96px);line-height:1.2;background:var(--card);border:3px solid var(--c);border-radius:20px;padding:12px 28px;max-width:100%;text-align:center;word-break:keep-all}
.bigemo{font-size:clamp(110px,28vmin,170px);line-height:1}

.choices{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.choices.words{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.choice{min-height:clamp(76px,12vh,112px);border-radius:20px;border:3px solid var(--line);background:var(--card);box-shadow:0 5px 0 var(--press);
  display:grid;place-items:center;padding:6px;transition:background .15s,border-color .15s,opacity .2s}
.choice:active{transform:translateY(3px);box-shadow:0 2px 0 var(--press)}
.choice .kana{font-family:var(--f-kana);font-weight:600;font-size:clamp(40px,9vmin,64px);line-height:1}
.choices.words .choice .kana{font-size:clamp(32px,7vmin,48px)}
.choice .emo{font-size:clamp(48px,11vmin,76px);line-height:1}
.choice .num{font-weight:900;font-size:clamp(34px,8vmin,56px);line-height:1;font-variant-numeric:tabular-nums}
.choice .num small{font-size:.5em;font-weight:700}
.choice .tm{font-weight:900;font-size:clamp(24px,5.4vmin,36px);line-height:1}
.choice.right{border-color:var(--life);background:var(--lifeBg);box-shadow:0 5px 0 var(--life)}
.choice.reveal{border-color:var(--life);background:var(--lifeBg);animation:pulse 1s ease 2}
.choice.wrong{border-color:var(--oops);background:var(--oopsBg);opacity:.5;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulse{50%{transform:scale(1.05)}}
.qfoot{display:flex;align-items:center;justify-content:center;gap:12px;min-height:52px;flex-wrap:wrap}
.msg{font-weight:900;font-size:22px;min-height:1.6em}
.msg.ok{color:var(--life)} .msg.oops{color:var(--oops)}
.hint{background:var(--card);border:2px dashed var(--c);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-weight:700}

/* math visuals */
.eq{display:flex;align-items:center;gap:clamp(8px,2vw,18px);font-weight:900;font-size:clamp(52px,13vmin,96px);line-height:1;font-variant-numeric:tabular-nums}
.eq .op{color:var(--c)}
.blank,.blank2{display:inline-grid;place-items:center;min-width:1.3em;height:1.25em;border:4px dashed var(--c);border-radius:14px;color:var(--c);font-size:.8em}
.hissan{display:grid;grid-template-columns:repeat(3,clamp(56px,14vmin,92px));font-weight:900;font-size:clamp(46px,11vmin,74px);line-height:1;font-variant-numeric:tabular-nums}
.hissan span{aspect-ratio:1;display:grid;place-items:center;border:1.5px solid var(--grid);background:var(--card)}
.hissan .op{color:var(--c)}
.hissan .ans{grid-column:1/4;aspect-ratio:auto;height:clamp(64px,15vmin,96px);border-top:5px solid var(--ink)}
.hissan .ans i{font-style:normal;width:auto;border:4px dashed var(--c);border-radius:14px;color:var(--c);font-size:.8em;padding:0 .4em}
.tfs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tf{display:grid;grid-template-columns:repeat(5,22px);gap:4px;padding:6px;border:2px solid var(--line);border-radius:8px;background:var(--paper)}
.blk{display:block;width:22px;height:22px;border-radius:5px;border:2px dashed var(--line)}
.blk.a{background:var(--math);border:0}
.blk.b{background:var(--oops);border:0}
.blk.x{background:var(--math);border:0;opacity:.25;position:relative}
.blk.x::after{content:"";position:absolute;inset:3px;background:linear-gradient(45deg,transparent 44%,var(--ink) 44%,var(--ink) 56%,transparent 56%)}
.pvs{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.pvg{display:flex;flex-direction:column;align-items:center;gap:4px}
.pv{display:flex;align-items:flex-end;gap:3px;flex-wrap:wrap;max-width:300px;justify-content:center}
.pv .bar{display:block;width:12px;height:60px;border-radius:3px;background:var(--math);background-image:repeating-linear-gradient(transparent 0 5px,rgba(255,255,255,.55) 5px 6px)}
.pv .cube{display:block;width:12px;height:12px;border-radius:3px;background:var(--oops)}
.pvlab{font-size:14px;color:var(--ink2)}
.kgrid{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.krow{display:flex;gap:4px;padding:3px 6px;border:2px solid var(--line);border-radius:999px;background:var(--paper)}
.krow i{display:block;width:12px;height:12px;border-radius:50%;background:var(--math)}
.clock{width:clamp(200px,48vmin,300px);height:auto;max-width:100%}
.clock .cf{fill:var(--card);stroke:var(--ink);stroke-width:5}
.clock .tk{stroke:var(--ink2);stroke-width:1.5}
.clock .tk5{stroke:var(--ink);stroke-width:3.5}
.clock .cn{fill:var(--ink);font-family:var(--f-body);font-weight:900;font-size:19px;text-anchor:middle;dominant-baseline:central}
.clock .hh{stroke:var(--kata);stroke-width:9;stroke-linecap:round}
.clock .mh{stroke:var(--math);stroke-width:6;stroke-linecap:round}
.clock .cc{fill:var(--ink)}
.story{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 18px;font-size:clamp(19px,4.2vw,24px);font-weight:700;line-height:1.7;max-width:640px}
.items{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:center}
.grp{display:flex;flex-wrap:wrap;gap:2px;max-width:220px;justify-content:center;padding:8px 10px;border-radius:14px;background:var(--cb);font-size:clamp(28px,6.5vmin,40px);line-height:1.1}
.grp.b{background:var(--oopsBg)}
.grp .gone{opacity:.25;filter:grayscale(1)}
.plates{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.plate{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;width:96px;padding:10px 6px;border-radius:50%;border:3px solid var(--line);background:var(--card);font-size:24px;line-height:1.1}

@media (orientation:landscape) and (max-height:620px){
  .quiz{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr auto;column-gap:20px;row-gap:8px}
  .quiz .qbar,.quiz .prompt,.quiz .qfoot{grid-column:1/3}
  .quiz .stage{grid-row:3;grid-column:1}
  .quiz .hint{grid-row:4;grid-column:1}
  .quiz .choices{grid-row:3;grid-column:2;align-content:center}
  .quiz .qfoot{grid-row:5}
}

/* ---------- result ---------- */
.result{align-items:center;justify-content:center;text-align:center;gap:14px}
.hanamaru{width:clamp(160px,40vmin,230px);height:auto}
.hanamaru path{fill:none;stroke:var(--kata);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease-out forwards}
.hanamaru .hm-petal{animation-delay:.8s;animation-duration:1.2s}
.rtitle{font-size:clamp(28px,7vw,40px);font-weight:900}
.rstars{font-size:clamp(34px,8vw,46px);letter-spacing:.06em;line-height:1}
.st{color:var(--line)} .st.on{color:var(--star)}
.rsub{color:var(--ink2);font-weight:700}
.newst{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:10px 18px;font-weight:700}
.stk{font-size:56px;line-height:1;display:inline-block}
.stk.pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both .9s}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}to{transform:none}}
.result .rbtns{width:100%;max-width:640px}

/* ---------- life / scenes ---------- */
.scard{background:var(--card);border:3px solid var(--c);border-radius:24px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center}
.sicon{grid-row:1/3;font-size:clamp(56px,13vw,84px);line-height:1}
.stitle{font-size:clamp(21px,4.8vw,28px);font-weight:900;color:var(--c)}
.stext{font-size:clamp(19px,4.3vw,24px);font-weight:700;line-height:1.75}
.sopts{display:grid;gap:12px}
.sopt{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;text-align:left;padding:14px 16px;min-height:76px;border-radius:20px;border:3px solid var(--line);background:var(--card);box-shadow:0 5px 0 var(--press);font-size:clamp(18px,4vw,22px);font-weight:700;line-height:1.55}
.sopt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--press)}
.sopt .mark{width:44px;height:44px;border-radius:50%;border:3px solid var(--c);color:var(--c);display:grid;place-items:center;font-family:var(--f-kana);font-size:24px}
.sopt.right{border-color:var(--life);background:var(--lifeBg);box-shadow:0 5px 0 var(--life)}
.sopt.wrong{border-color:var(--oops);background:var(--oopsBg);opacity:.6}
.sopt.dim{opacity:.45}
.sfb{border-radius:20px;padding:16px 18px;display:grid;gap:10px;font-size:clamp(18px,4vw,21px);font-weight:500;line-height:1.75}
.sfb.good{background:var(--lifeBg);border:3px solid var(--life)}
.sfb.soft{background:var(--oopsBg);border:3px dashed var(--oops)}
.fbh{font-weight:900;font-size:1.2em}
.sfb.good .fbh{color:var(--life)} .sfb.soft .fbh{color:var(--oops)}
.plus{display:inline-block;margin-left:8px;color:var(--star);background:var(--card);border-radius:999px;padding:0 10px;font-size:.8em}
.tip{background:var(--card);border-radius:14px;padding:12px 14px}
.tip b{display:block;font-size:14px;color:var(--life);letter-spacing:.1em}
.small{font-size:.9em;color:var(--ink2)}
.sclist{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}

.introbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--c)}
.introbtn .e{font-size:44px}
.introbtn small{display:block;font-weight:500;font-size:15px;color:var(--ink2)}
.progress{height:14px;border-radius:999px;background:var(--line);overflow:hidden}

.icard{flex:1;background:var(--card);border:3px solid var(--c);border-radius:26px;padding:22px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.icard .e{font-size:72px;line-height:1;text-align:center}
.icard h2{font-size:clamp(24px,6vw,34px);font-weight:900;color:var(--c);text-align:center}
.icard p,.icard li{font-size:clamp(19px,4.3vw,23px);font-weight:700;line-height:1.8}
.icard ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.icard li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--cb);border-radius:14px;padding:10px 14px}
.icard li span{font-size:28px;line-height:1.4}
.icard li small{display:block;font-weight:500;font-size:.85em;color:var(--ink2);line-height:1.6}
.idots{display:flex;justify-content:center;gap:8px}

.idots i.on{background:var(--c)}
.inav{display:grid;grid-template-columns:1fr 1fr;gap:12px}
ruby rt{font-size:.45em;font-weight:500}

/* ---------- stickers ---------- */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px}
.slot{aspect-ratio:1;border-radius:16px;border:2.5px dashed var(--line);display:grid;place-items:center;font-size:clamp(34px,8vw,46px);color:var(--line);font-weight:900}
.slot.on{border:2.5px solid transparent;background:var(--paper)}

/* ---------- move break ---------- */
.move{align-items:center;text-align:center;justify-content:center}
.mvtext{font-size:clamp(26px,6.5vw,40px);font-weight:900;line-height:1.5}

.ring{width:clamp(150px,36vmin,210px);height:auto}
.ring circle{fill:none;stroke-width:12}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--star);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s linear}
.ring text{fill:var(--ink);font-family:var(--f-body);font-weight:900;font-size:44px;text-anchor:middle;dominant-baseline:central}

/* ---------- parent ---------- */
.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px 18px;display:grid;gap:12px;-webkit-user-select:text;user-select:text}
.panel h2{font-size:19px;font-weight:900}
.panel p,.panel li{font-size:16px;line-height:1.75;font-weight:500}
.panel ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:700}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.seg button{min-width:64px;min-height:48px;border:0;background:var(--card);font-weight:700}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--paper);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:13px;color:var(--ink2)}
.warnbtn{min-height:48px;border-radius:14px;border:2px solid var(--oops);background:transparent;color:var(--oops);font-weight:700;padding:6px 16px}
.note{font-size:14px;color:var(--ink2);line-height:1.7}

.overlay{position:fixed;inset:0;background:rgba(10,16,26,.55);display:grid;place-items:center;padding:20px;z-index:20}
.dialog{background:var(--card);border-radius:24px;padding:24px;max-width:420px;width:100%;display:grid;gap:16px;text-align:center}
.dialog p{font-size:22px;font-weight:900}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}
}

<body>
<div id="app" aria-live="polite"></div>
<script>
(()=>{
"use strict";
document.documentElement.lang="ja";
const $app=document.getElementById("app");
const $=s=>document.querySelector(s);

/* ================= storage ================= */
const store={
  get(k,d){try{const v=localStorage.getItem("gungun."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("gungun."+k,JSON.stringify(v))}catch(e){}}
};
let S=Object.assign({stars:0,stickers:[],best:{},done:{},rounds:0,moves:0},store.get("state",{}));
let CFG=Object.assign({q:5,voice:true,sound:true},store.get("cfg",{}));
const save=()=>{store.set("state",S);store.set("cfg",CFG)};

/* ================= helpers ================= */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const any=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,n)=>shuffle(a).slice(0,n);
let TM=[];
const later=(f,ms)=>TM.push(setTimeout(f,ms));
const every=(f,ms)=>TM.push(setInterval(f,ms));
const clearTimers=()=>{TM.forEach(t=>{clearTimeout(t);clearInterval(t)});TM=[]};

/* ================= sound & voice ================= */
let AC=null;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}
  if(AC&&AC.state==="suspended"){try{AC.resume()}catch(e){}}
  return AC;
}
function tone(f,t0,d,type,g){
  const a=ac();if(!a)return;
  const o=a.createOscillator(),v=a.createGain(),t=a.currentTime+t0;
  o.type=type||"sine";o.frequency.value=f;
  v.gain.setValueAtTime(0.0001,t);v.gain.exponentialRampToValueAtTime(g||0.14,t+0.02);v.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(v);v.connect(a.destination);o.start(t);o.stop(t+d+0.05);
}
function sfx(k){
  if(!CFG.sound)return;
  if(k==="ok"){tone(784,0,.16,"triangle");tone(1175,.12,.28,"triangle")}
  else if(k==="ng"){tone(330,0,.22,"sine",.08);tone(294,.12,.25,"sine",.06)}
  else if(k==="fan"){[523,659,784,1047].forEach((f,i)=>tone(f,i*.13,.32,"triangle",.12))}
  else if(k==="tap"){tone(660,0,.05,"sine",.04)}
  else if(k==="tick"){tone(990,0,.04,"square",.02)}
}
let JAVOICE=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();JAVOICE=vs.find(v=>/^ja/i.test(v.lang)&&/kyoko|o-ren|siri/i.test(v.name))||vs.find(v=>/^ja/i.test(v.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function speak(text){
  if(!CFG.voice||!text)return;
  try{
    speechSynthesis.cancel();
    const clean=String(text).replace(/<rt>.*?<\/rt>/g,"").replace(/<[^>]+>/g,"").replace(/\p{Extended_Pictographic}|️/gu,"").replace(/[★⭐]/g,"");
    const u=new SpeechSynthesisUtterance(clean);u.lang="ja-JP";u.rate=0.9;u.pitch=1.05;if(JAVOICE)u.voice=JAVOICE;
    speechSynthesis.speak(u);
  }catch(e){}
}
const stopSpeak=()=>{try{speechSynthesis.cancel()}catch(e){}};

/* ================= katakana data ================= */
const ROWS={
  a:["アイウエオ","あいうえお"],ka:["カキクケコ","かきくけこ"],sa:["サシスセソ","さしすせそ"],ta:["タチツテト","たちつてと"],na:["ナニヌネノ","なにぬねの"],
  ha:["ハヒフヘホ","はひふへほ"],ma:["マミムメモ","まみむめも"],ya:["ヤユヨ","やゆよ"],ra:["ラリルレロ","らりるれろ"],wa:["ワヲン","わをん"],
  ga:["ガギグゲゴ","がぎぐげご"],za:["ザジズゼゾ","ざじずぜぞ"],da:["ダヂヅデド","だぢづでど"],ba:["バビブベボ","ばびぶべぼ"],pa:["パピプペポ","ぱぴぷぺぽ"]
};
const H={},ROWOF={};
for(const r in ROWS){const[k,h]=ROWS[r];[...k].forEach((c,i)=>{H[c]=h[i];ROWOF[c]=r})}
Object.assign(H,{"ャ":"ゃ","ュ":"ゅ","ョ":"ょ","ッ":"っ","ー":"ー"});
const itemsOf=rows=>rows.flatMap(r=>[...ROWS[r][0]].map(c=>({k:c,h:H[c],row:r})));
const YOUON=[];
[..."キシチニヒミリギジビピ"].forEach(b=>[..."ャュョ"].forEach(s=>YOUON.push({k:b+s,h:H[b]+H[s],base:b})));
const SIMILAR=[["シ","ツ","ソ","ン"],["ク","ケ","タ","ワ"],["ウ","ワ","フ","ラ"],["ヌ","ス","メ","ナ"],["コ","ユ","ロ","ヨ"],["チ","テ","ナ","キ"],["マ","ム","ア","ヤ"],["エ","ユ","コ","ニ"],["ハ","ル","リ","ソ"]];
const SIM_TIPS={
  "シ":"シは てんが ひだりに たてに ならぶよ。 さいごは したから うえへ はらう。",
  "ツ":"ツは てんが うえに よこに ならぶよ。 さいごは うえから したへ はらう。",
  "ソ":"ソは てんが うえ。 さいごは うえから したへ はらう。",
  "ン":"ンは てんが ひだり。 さいごは したから うえへ はらう。",
  "ク":"クは 2かく。 なかに なにも ないよ。",
  "ケ":"ケは よこぼうが まんなかを つきぬけるよ。",
  "タ":"タは クの なかに てんが 1つ。",
  "ワ":"ワは うえが たいらな はこの かたち。",
  "ウ":"ウは うえに てんが 1つ のってるよ。",
  "フ":"フは 1かくで かく。 てんは ないよ。",
  "ラ":"ラは うえに みじかい よこぼうが あるよ。",
  "ヌ":"ヌは フに ななめの てんが つくよ。",
  "ス":"スは さいごの てんが みぎしたに でるよ。",
  "メ":"メは ななめの せんが 2ほん クロス。",
  "ナ":"ナは よこぼうと たてぼうの 2かく。",
  "コ":"コは みぎが とじてて、 ひだりが あいてるよ。",
  "ユ":"ユは したの よこぼうが ながく でるよ。",
  "ロ":"ロは ぜんぶ とじた しかく。",
  "ヨ":"ヨは よこぼうが 3ぼん。",
  "チ":"チは うえに ななめの せんが あるよ。",
  "テ":"テは うえに よこぼうが 2ほん。",
  "キ":"キは よこぼうが 2ほん で、 たてが つきぬける。",
  "マ":"マは した が みぎむきの てん。",
  "ム":"ムは さんかくの みぎに てんが あるよ。",
  "ア":"アは マに にてるけど、 したに ながい はらいが あるよ。",
  "ヤ":"ヤは ななめの せんが つきでるよ。",
  "エ":"エは よこぼう 2ほんを たてで つなぐよ。",
  "ニ":"ニは よこぼうが 2ほん だけ。",
  "ハ":"ハは はなれた 2ほんの せん。",
  "ル":"ルは みぎの せんが はねあがるよ。",
  "リ":"リは みぎの せんが ながいよ。"
};
const WORDS=[["ライオン","🦁"],["パンダ","🐼"],["ペンギン","🐧"],["コアラ","🐨"],["ゴリラ","🦍"],["キリン","🦒"],["カンガルー","🦘"],["イルカ","🐬"],["シマウマ","🦓"],["ハムスター","🐹"],["フラミンゴ","🦩"],
  ["バナナ","🍌"],["メロン","🍈"],["トマト","🍅"],["ケーキ","🍰"],["ピザ","🍕"],["パン","🍞"],["アイス","🍨"],["ドーナツ","🍩"],["チーズ","🧀"],["レモン","🍋"],["クッキー","🍪"],["ハンバーガー","🍔"],["ポテト","🍟"],["ラーメン","🍜"],["カレー","🍛"],["ジュース","🧃"],["ミルク","🥛"],["サンドイッチ","🥪"],["ホットドッグ","🌭"],["ブロッコリー","🥦"],
  ["トラック","🚚"],["バス","🚌"],["タクシー","🚕"],["ロケット","🚀"],["ヘリコプター","🚁"],["ヨット","⛵"],
  ["ギター","🎸"],["ピアノ","🎹"],["テレビ","📺"],["カメラ","📷"],["ロボット","🤖"],["プレゼント","🎁"],["スプーン","🥄"],["ネクタイ","👔"],["ドレス","👗"],["シャツ","👕"],["ベッド","🛏️"],["ドア","🚪"],["ランドセル","🎒"],["クレヨン","🖍️"],["ノート","📓"],["マイク","🎤"],["テント","⛺"],["ベル","🔔"],["トイレ","🚽"],["ボール","⚽"]];

/* ================= question builders ================= */
const isSmall=c=>"ャュョッァィゥェォゃゅょっ".includes(c);
function masuHTML(str,cls){
  const cs=[...str];
  return `<div class="masus ${cs.length>1?"two":""}">${cs.map(c=>`<span class="masu ${cls} ${isSmall(c)?"small":""}"><span>${c}</span></span>`).join("")}</div>`;
}
function kanaQ(it,others,dir,hint){
  const opts=shuffle([it,...others]);
  const kh=dir==="kh";
  return{theme:"kata",key:it.k+dir,
    prompt:kh?"この カタカナは どれかな？":"カタカナで かくと どれかな？",
    show:masuHTML(kh?it.k:it.h,kh?"kk":"hh")+`<div class="masulabel">${kh?"カタカナ":"ひらがな"}</div>`,
    choices:opts.map(o=>({v:o.k,html:`<span class="kana">${kh?o.h:o.k}</span>`})),
    ans:it.k,say:it.h,sayQ:kh?"この カタカナは どれかな？":`「${it.h}」は カタカナで どれかな？`,hint};
}
const rowHint=it=>`「${ROWS[it.row][0][0]}」の ぎょうの じ だよ<br><span style="font-family:var(--f-kana);font-size:30px;letter-spacing:.2em">${ROWS[it.row][0]}</span>`;
function makeRows(rows,n){
  const pool=itemsOf(rows);
  const targets=[];while(targets.length<n)targets.push(...shuffle(pool));
  return targets.slice(0,n).map(it=>kanaQ(it,sample(pool.filter(p=>p.k!==it.k),3),Math.random()<.65?"kh":"hk",rowHint(it)));
}
function makeSimilar(n){
  const out=[];const used=new Set();let guard=0;
  while(out.length<n&&guard++<300){
    const g=any(SIMILAR);const c=any(g);if(used.has(c)&&used.size<20)continue;used.add(c);
    const it={k:c,h:H[c]};
    const others=g.filter(x=>x!==c).map(x=>({k:x,h:H[x]}));
    out.push(kanaQ(it,others,Math.random()<.7?"hk":"kh",SIM_TIPS[c]||null));
  }
  return out;
}
function makeYouon(n){
  return sample(YOUON,n).map(it=>{
    const same=sample(YOUON.filter(y=>y.base===it.base&&y.k!==it.k),2);
    const other=sample(YOUON.filter(y=>y.base!==it.base),1);
    return kanaQ(it,[...same,...other],Math.random()<.6?"kh":"hk",
      `${[...it.k][0]} ＋ ちいさい ${[...it.k][1]}<br>「${[...it.h][0]}」と「${[...it.h][1]}」を くっつけて よむよ`);
  });
}
function makeWords(n,mode){
  return sample(WORDS,n).map(w=>{
    const opts=shuffle([w,...sample(WORDS.filter(x=>x[0]!==w[0]),3)]);
    if(mode==="w2e")return{theme:"kata",key:w[0],prompt:"この ことばの えは どれかな？",
      show:`<div class="wordcard">${w[0]}</div>`,
      choices:opts.map(o=>({v:o[0],html:`<span class="emo">${o[1]}</span>`})),
      ans:w[0],say:w[0],sayQ:"この ことばの えは どれかな？",hint:`さいしょの じは「${H[w[0][0]]||w[0][0]}」だよ`};
    return{theme:"kata",key:w[0],prompt:"この えの ことばは どれかな？",
      show:`<div class="bigemo">${w[1]}</div>`,
      choices:opts.map(o=>({v:o[0],html:`<span class="kana">${o[0]}</span>`})),
      ans:w[0],say:w[0],sayQ:"この えの ことばは どれかな？",hint:`さいしょの じは「${w[0][0]}」だよ`,cls:"words"};
  });
}

/* math */
function numChoices(ans,offs){
  const set=new Set([ans]);
  for(const o of shuffle(offs||[1,-1,2,-2,10,-10])){if(set.size>=4)break;const v=ans+o;if(v>=0)set.add(v)}
  let k=3;while(set.size<4){set.add(ans+k);k++}
  return shuffle([...set]);
}
function mathQ(key,show,ans,o){
  o=o||{};
  return{theme:"math",key,prompt:o.prompt||"こたえは どれかな？",show,
    choices:numChoices(ans,o.offs).map(v=>({v:String(v),html:`<span class="num">${v}${o.unit?`<small>${o.unit}</small>`:""}</span>`})),
    ans:String(ans),say:o.say||String(ans),sayQ:o.sayQ,hint:o.hint||null};
}
const eq=(a,op,b)=>`<div class="eq"><span>${a}</span><span class="op">${op}</span><span>${b}</span><span class="op">=</span><span class="blank">?</span></div>`;
function frames(a,b,mode){
  const total=mode==="add"?a+b:a;
  const cells=[];
  for(let i=0;i<Math.max(10,Math.ceil(total/10)*10);i++){
    let c="";
    if(i<total){
      if(mode==="add")c=i<a?"a":"b";
      else{const crossFromTen=a>10&&b>a-10;c=crossFromTen?(i<b?"x":"a"):(i>=a-b?"x":"a")}
    }
    cells.push(`<i class="blk ${c}"></i>`);
  }
  let html="";for(let i=0;i<cells.length;i+=10)html+=`<div class="tf">${cells.slice(i,i+10).join("")}</div>`;
  return `<div class="tfs">${html}</div>`;
}
function pv(n){const t=Math.floor(n/10),o=n%10;return `<div class="pvg"><div class="pv">${'<i class="bar"></i>'.repeat(t)}${'<i class="cube"></i>'.repeat(o)}</div><div class="pvlab">${n}： 10が ${t}こ、 1が ${o}こ</div></div>`}
const hissan=(a,op,b)=>{const A=String(a).padStart(2," "),B=String(b).padStart(2," ");
  return `<div class="hissan" aria-label="${a} ${op} ${b}"><span></span><span>${A[0]}</span><span>${A[1]}</span><span class="op">${op}</span><span>${B[0]}</span><span>${B[1]}</span><span class="ans"><i>?</i></span></div>`};
function uniq(n,f){const out=[],seen=new Set();let g=0;while(out.length<n&&g++<600){const q=f();if(seen.has(q.key))continue;seen.add(q.key);out.push(q)}return out}

const genAdd10=()=>{const a=rnd(1,9),b=rnd(1,10-a);return mathQ(`${a}+${b}`,eq(a,"+",b),a+b,{sayQ:`${a} たす ${b} は？`,say:`${a} たす ${b} は ${a+b}`,hint:frames(a,b,"add")+"<span>あおと オレンジを あわせて かぞえよう</span>"})};
const genSub10=()=>{const a=rnd(2,10),b=rnd(1,a);return mathQ(`${a}-${b}`,eq(a,"−",b),a-b,{sayQ:`${a} ひく ${b} は？`,say:`${a} ひく ${b} は ${a-b}`,hint:frames(a,b,"sub")+"<span>✕の ぶんを とると、 のこりは いくつ？</span>"})};
const genAdd20=()=>{const a=rnd(2,9),b=rnd(Math.max(2,11-a),9);return mathQ(`${a}+${b}`,eq(a,"+",b),a+b,{sayQ:`${a} たす ${b} は？`,say:`${a} たす ${b} は ${a+b}`,hint:frames(a,b,"add")+`<span>まず 10を つくろう！ ${a}は あと ${10-a}で 10</span>`})};

const tl=(h,m)=>m===0?`${h}じ`:`${h}じ${fun(m)}`;
function clockSVG(h,m){
  const P=(r,deg)=>[(100+r*Math.sin(deg*Math.PI/180)).toFixed(1),(100-r*Math.cos(deg*Math.PI/180)).toFixed(1)];
  let s=`<svg class="clock" viewBox="0 0 200 200" role="img" aria-label="とけい"><circle cx="100" cy="100" r="94" class="cf"/>`;
  for(let i=0;i<60;i++){const[x1,y1]=P(i%5?84:78,i*6),[x2,y2]=P(89,i*6);s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${i%5?"tk":"tk5"}"/>`}
  for(let n=1;n<=12;n++){const[x,y]=P(65,n*30);s+=`<text x="${x}" y="${y}" class="cn">${n}</text>`}
  const[hx,hy]=P(44,((h%12)+m/60)*30),[mx,my]=P(72,m*6);
  return s+`<line x1="100" y1="100" x2="${hx}" y2="${hy}" class="hh"/><line x1="100" y1="100" x2="${mx}" y2="${my}" class="mh"/><circle cx="100" cy="100" r="6" class="cc"/></svg>`;
}
const genClock=()=>{
  const h=rnd(1,12),m=rnd(0,11)*5;const ans=tl(h,m);
  const cand=shuffle([tl(m===0?12:m/5,(h%12)*5),tl(h%12+1,m),tl(h,(m+5)%60),tl(h,(m+55)%60),tl(h===1?12:h-1,m),tl(h,(m+30)%60)]);
  const set=[ans];for(const c of cand){if(set.length>=4)break;if(!set.includes(c))set.push(c)}
  return{theme:"math",key:ans,prompt:"なんじ なんぷん かな？",show:clockSVG(h,m),
    choices:shuffle(set).map(t=>({v:t,html:`<span class="tm">${t}</span>`})),ans,say:ans,sayQ:"なんじ なんぷん かな？",
    hint:`<span><span style="color:var(--kata)">みじかい はり</span> → 「なんじ」<br><span style="color:var(--math)">ながい はり</span> → 「なんぷん」<br>すうじ 1つ すすむと 5ふん だよ</span>`};
};

   <div class="hint" id="hint" hidden>${q.hint||""}</div>
   <div class="choices ${q.cls||""}">${q.choices.map(c=>`<button class="choice" data-act="pick" data-v="${c.v}">${c.html}</button>`).join("")}</div>
   <div class="qfoot">${q.hint?`<button class="softbtn" data-act="hint" id="hintbtn">ヒントを みる</button>`:""}<span class="msg" id="msg" aria-live="assertive"></span></div>

function setMsg(t,cls){const m=$("#msg");if(m){m.textContent=t;m.className="msg "+(cls||"")}}
function showHint(){const h=$("#hint"),b=$("#hintbtn");if(h)h.hidden=false;if(b)b.hidden=true}
function nextQ(){Q.i++;if(Q.i<Q.qs.length){renderQ();window.scrollTo(0,0)}else showResult()}
function hanamaru(){
  let sp="";for(let t=0;t<=Math.PI*5;t+=0.12){const r=5+t*3.3;sp+=(sp?"L":"M")+(100+r*Math.cos(t-1.4)).toFixed(1)+" "+(100+r*Math.sin(t-1.4)).toFixed(1)}
  let pe="";for(let d=0;d<=360;d+=2){const a=d*Math.PI/180,r=70+15*Math.abs(Math.sin(a*4.5));pe+=(pe?"L":"M")+(100+r*Math.cos(a)).toFixed(1)+" "+(100+r*Math.sin(a)).toFixed(1)}
  return `<svg class="hanamaru" viewBox="0 0 200 200" role="img" aria-label="はなまる"><path class="hm-spiral" d="${sp}" pathLength="1"/><path class="hm-petal" d="${pe}" pathLength="1"/></svg>`;
}
function awardSticker(){
  const left=STICKERS.filter(s=>!S.stickers.includes(s));if(!left.length)return null;
  const s=any(left);S.stickers.push(s);return s;
}
function showResult(){
  const L=Q.L,n=Q.qs.length,got=Q.got;
  S.stars+=got;S.rounds++;
  const b=S.best[L.id]||{got:0,n:n,plays:0};b.plays=(b.plays||0)+1;if(got/n>=b.got/b.n){b.got=got;b.n=n}S.best[L.id]=b;
  const st=awardSticker();save();sfx("fan");
  view.name="result";
  $app.innerHTML=`<div class="screen result t-${L.sec==="kataMenu"?"kata":"math"}">
    ${hanamaru()}
    <h2 class="rtitle">さいごまで できたね！</h2>
    <p class="rstars" role="img" aria-label="ほし ${got}こ">${'<span class="st on">★</span>'.repeat(got)}${'<span class="st">★</span>'.repeat(n-got)}</p>
    <p class="rsub">${n}もん ちゅう ${got}もん せいかい</p>
    ${st?`<div class="newst"><span class="stk pop">${st}</span><span>あたらしい シールを ゲット！</span></div>`:""}
    <div class="rbtns">
      <button class="bigbtn move" data-go="move" data-arg="${L.sec}">🤸 うごこう タイム</button>
      <button class="bigbtn" data-act="again">もう いちど</button>
      <button class="bigbtn ghost" data-go="${L.sec}">メニューへ</button>
    </div></div>`;
  window.scrollTo(0,0);
  later(()=>speak(`さいごまで できたね！ ${got}もん せいかい！`),400);
}

const ACTS={
  start:t=>startQuiz(t.dataset.arg),
  again:()=>startQuiz(Q.L.id),
  sayQ:()=>speak(Q&&Q.qs[Q.i].sayQ),
  hint:()=>{showHint();const q=Q.qs[Q.i];speak(String(q.hint).replace(/<br>/g,"。 "))},
  pick:t=>{
    if(!Q||Q.lock)return;const q=Q.qs[Q.i];
    if(t.dataset.v===q.ans){
      Q.lock=true;t.classList.add("right");const ok=Q.tries<2;Q.res[Q.i]=ok;if(ok)Q.got++;
      sfx("ok");const m=document.querySelector(".maru");if(m)m.classList.add("show");setMsg(any(PRAISE),"ok");speak(q.say);
      later(nextQ,1600);
    }else{
      Q.tries++;t.classList.add("wrong");t.disabled=true;sfx("ng");
      if(Q.tries>=2){
        Q.lock=true;Q.res[Q.i]=false;
        document.querySelectorAll(".choice").forEach(b=>{if(b.dataset.v===q.ans)b.classList.add("reveal")});
        setMsg("こたえは これ！ つぎは できるよ","oops");speak("こたえは "+q.say);later(nextQ,2800);
      }else{setMsg("おしい！ もう いちど","oops");if(q.hint)showHint()}
    }
  },
  quitAsk:()=>{
    const d=document.createElement("div");d.className="overlay";d.id="ov";
    d.innerHTML=`<div class="dialog" role="dialog" aria-modal="true"><p>とちゅうで やめる？</p><div class="rbtns"><button class="bigbtn" data-act="quitNo">つづける</button><button class="bigbtn ghost" data-act="quitYes">やめる</button></div></div>`;
    document.body.appendChild(d);
  },
  quitNo:()=>{const o=$("#ov");if(o)o.remove()},
  quitYes:()=>{const o=$("#ov");if(o)o.remove();go(Q?Q.L.sec:"home")},
  sayScene:()=>{const s=SC.sc;speak(`${s.title}。 ${s.text}。 あなたなら どうする？ `+SC.order.map((oi,j)=>`${"アイウ"[j]}。 ${s.opts[oi].t}`).join(" "))},
  sayIntro:()=>{const i=+view.arg||0;const c=INTRO[i];speak(c.h+"。 "+c.b.replace(/<small>/g,"。 ").replace(/<\/li>/g,"。 "))},
  scenePick:t=>{
    if(!SC||SC.solved||t.disabled)return;
    const o=SC.sc.opts[+t.dataset.i],fb=$("#sfb");fb.hidden=false;
    if(o.good){
      SC.solved=true;t.classList.add("right");
      document.querySelectorAll(".sopt").forEach(b=>{if(b!==t)b.classList.add("dim")});
      const first=!S.done[SC.sc.id];if(first){S.done[SC.sc.id]=true;S.stars++;save()}
      sfx("ok");fb.className="sfb good";
      fb.innerHTML=`<p class="fbh">いい アイデア！${first?'<span class="plus">★ +1</span>':""}</p><p>${o.fb}</p><div class="tip"><b>まめちしき</b><p>${SC.sc.tip}</p></div>
        <div class="rbtns"><button class="bigbtn" data-act="nextScene">つぎの おはなし →</button><button class="bigbtn ghost" data-go="lifeMenu">もどる</button></div>`;
      speak("いい アイデア！ "+o.fb+" まめちしき。 "+SC.sc.tip);
    }else{
      t.classList.add("wrong");t.disabled=true;sfx("ng");fb.className="sfb soft";
      fb.innerHTML=`<p class="fbh">うーん、 どうかな？</p><p>${o.fb}</p><p class="small">ほかの ほうほうも えらんで みよう。</p>`;
      speak(o.fb);
    }
    later(()=>fb.scrollIntoView({behavior:"smooth",block:"nearest"}),60);
  },
  nextScene:()=>{
    const i=SCENES.indexOf(SC.sc);
    const nxt=SCENES.slice(i+1).concat(SCENES.slice(0,i+1)).find(s=>!S.done[s.id])||SCENES[(i+1)%SCENES.length];
    go("scene",nxt.id);
  },
  setQ:t=>{CFG.q=+t.dataset.arg;save();go("parent")},
  setVoice:t=>{CFG.voice=t.dataset.arg==="true";save();go("parent");if(CFG.voice)speak("よみあげを オンに しました")},
  setSound:t=>{CFG.sound=t.dataset.arg==="true";save();go("parent");sfx("ok")},
  resetAsk:()=>{
    const d=document.createElement("div");d.className="overlay";d.id="ov";
    d.innerHTML=`<div class="dialog" role="dialog" aria-modal="true"><p>★・シール・記録をすべて消しますか？</p><div class="rbtns"><button class="bigbtn ghost" data-act="quitNo">やめる</button><button class="bigbtn" style="background:var(--oops);border-color:var(--oops)" data-act="resetYes">消す</button></div></div>`;
    document.body.appendChild(d);
  },
  resetYes:()=>{const o=$("#ov");if(o)o.remove();S={stars:0,stickers:[],best:{},done:{},rounds:0,moves:0};save();go("parent")}
};

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-go],[data-act]");if(!t||t.disabled)return;
  ac();
  if(t.dataset.go){sfx("tap");go(t.dataset.go,t.dataset.arg)}
  else if(ACTS[t.dataset.act])ACTS[t.dataset.act](t,e);
});
document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});

go("home");
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
